services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-awd}
      POSTGRES_USER: ${POSTGRES_USER:-awd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-awd}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev-redis-password}"]
    ports:
      - "6379:6379"

  control-panel:
    build:
      context: .
      dockerfile: docker/control-panel.Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-awd-infra}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://awd:awd@postgres:5432/awd?sslmode=disable}
      POSTGRES_ARTIFACT_DIR: ${POSTGRES_ARTIFACT_DIR:-/var/lib/awd/artifacts}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
      CONTROL_PANEL_LOG_OUTPUT_LIMIT: ${CONTROL_PANEL_LOG_OUTPUT_LIMIT:-4096}
      CONTROL_PANEL_TOKEN: ${CONTROL_PANEL_TOKEN:-dev-admin-token}
      RUNNER_SECRET: ${RUNNER_SECRET:-dev-runner-secret}
      SUBMITTER_SECRET: ${SUBMITTER_SECRET:-dev-submitter-secret}
    volumes:
      - awd-uploads:/var/lib/awd
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"

  scheduler:
    build:
      context: .
      dockerfile: docker/scheduler.Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-awd-infra}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://awd:awd@postgres:5432/awd?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
      CONTROL_PANEL_TOKEN: ${CONTROL_PANEL_TOKEN:-dev-admin-token}
      SCHEDULER_POLL_INTERVAL: ${SCHEDULER_POLL_INTERVAL:-5s}
      SCHEDULER_MAX_BATCH: ${SCHEDULER_MAX_BATCH:-50}
    volumes:
      - awd-uploads:/var/lib/awd
    depends_on:
      - control-panel

  dispatcher:
    build:
      context: .
      dockerfile: docker/dispatcher.Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-awd-infra}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgres://awd:awd@postgres:5432/awd?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password}
      CONTROL_PANEL_TOKEN: ${CONTROL_PANEL_TOKEN:-dev-admin-token}
    depends_on:
      - scheduler
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - control-panel
    ports:
      - "5173:80"

volumes:
  postgres-data:
  awd-uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./tmp/awd
