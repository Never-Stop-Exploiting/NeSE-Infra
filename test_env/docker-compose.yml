services:
  flagserver:
    build:
      context: ./flagserver
      dockerfile: Dockerfile
    container_name: flagserver
    environment:
      - time=5
      - p=0.1
    ports:
      - "5000:5000"
    image: flagserver:latest
    pull_policy: never
  challenge:
    build:
      context: ./challenge
      dockerfile: Dockerfile
    container_name: challenge
    ports:
      - "5001:5000"
    image: challenge:latest
    pull_policy: never
  runner-exp:
    build:
      context: ..
      dockerfile: ./test_env/exp/Dockerfile
    container_name: runner-exp
    environment:
      RUNNER_ID: requests-exp
      RUNNER_MAX_PARALLEL: 20
      RUNNER_TYPE: python
      RUNNER_SECRET: ${RUNNER_SECRET:-dev-runner-secret}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-http://192.168.66.206:8080}
      REDIS_ADDR: ${REDIS_ADDR:-192.168.66.206:6379}
      RUNNER_TAGS: ${RUNNER_TAGS:-requests}
  runner-exp2:
    build:
      context: ..
      dockerfile: ./test_env/exp/Dockerfile
    container_name: runner-exp2
    environment:
      RUNNER_ID: requests-exp2
      RUNNER_MAX_PARALLEL: 20
      RUNNER_TYPE: python
      RUNNER_SECRET: ${RUNNER_SECRET:-dev-runner-secret}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-http://192.168.66.206:8080}
      REDIS_ADDR: ${REDIS_ADDR:-192.168.66.206:6379}
      RUNNER_TAGS: ${RUNNER_TAGS:-requests}
  runner-exp3:
    build:
      context: ..
      dockerfile: ./test_env/exp/Dockerfile
    container_name: runner-exp3
    environment:
      RUNNER_ID: requests-exp3
      RUNNER_MAX_PARALLEL: 20
      RUNNER_TYPE: python
      RUNNER_SECRET: ${RUNNER_SECRET:-dev-runner-secret}
      CONTROL_PLANE_URL: ${CONTROL_PLANE_URL:-http://192.168.66.206:8080}
      REDIS_ADDR: ${REDIS_ADDR:-192.168.66.206:6379}
      RUNNER_TAGS: ${RUNNER_TAGS:-requests}
      RUNNER_ARTIFACT_CACHE_TTL: 3s