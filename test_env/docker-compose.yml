services:
  flagserver:
    build:
      context: ./flagserver
      dockerfile: Dockerfile
    container_name: flagserver
    environment:
      - time=5
      - p=0.1
    ports:
      - "5000:5000"
    image: flagserver:latest
    pull_policy: never
  challenge:
    build:
      context: ./challenge
      dockerfile: Dockerfile
    container_name: challenge
    ports:
      - "5001:5000"
    image: challenge:latest
    pull_policy: never
  runner-exp:
    build:
      context: ..
      dockerfile: ./test_env/exp/Dockerfile
    container_name: runner-exp
    env_file:
      - .env.runner
    environment:
      RUNNER_ID: requests-exp
      RUNNER_MAX_PARALLEL: 30

  runner-exp2:
    build:
      context: ..
      dockerfile: ./test_env/exp/Dockerfile
    container_name: runner-exp2
    env_file:
      - .env.runner
    environment:
      RUNNER_ID: requests-exp2
      RUNNER_ARTIFACT_CACHE_TTL: 3s
  runner-pwntools-exp:
    build:
      context: ..
      dockerfile: ./test_env/exp/Dockerfile.pwntools
    container_name: runner-pwntools-exp
    env_file:
      - .env.runner
    environment:
      RUNNER_ID: pwntools-exp
      RUNNER_MAX_PARALLEL: 30
      RUNNER_TAGS: pwntools

  flag-submitter-python:
    build:
      context: ..
      dockerfile: docker/flag-submitter-python.Dockerfile
    env_file:
      - .env.submitter
    environment:
      SUBMITTER_ID: local-python
      FLAG_SUBMITTER_GROUP: python
      FLAG_SUBMITTER_CONSUMER: python

  flag-submitter-python2:
    build:
      context: ..
      dockerfile: docker/flag-submitter-python.Dockerfile
    env_file:
      - .env.submitter
    environment:
      SUBMITTER_ID: local-python2
      FLAG_SUBMITTER_GROUP: python
      FLAG_SUBMITTER_CONSUMER: python